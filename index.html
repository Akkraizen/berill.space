<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berill — заметки, планы, привычки и тренировки в одном приложении</title>
    <meta
      name="description"
      content="Личное пространство для Windows и Android: заметки, планер, привычки, тренировки, питание, финансы и коллекции. Данные на устройстве, синхронизация через свой сервер со сквозным шифрованием."
    />
    <meta name="theme-color" content="#2e6b30" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10140f" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Berill" />
    <meta property="og:title" content="Berill — вся личная система в одном приложении" />
    <meta
      property="og:description"
      content="Заметки, планы, привычки, тренировки и питание на Windows и Android. Свой сервер синхронизации и сквозное шифрование."
    />
    <meta property="og:url" content="https://berill.space/" />
    <link rel="canonical" href="https://berill.space/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var saved = localStorage.getItem('berill.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
